# ТЗ роль-модели. Истина здесь: пункт этого файла — задача, его описание — её состояние.
# Что умеет харнесс — README.md, почему так — FAQ.md.
categories:
  - category: Выделение в самостоятельный инструмент
    items:
      - id: extracted-from-the-wrapper
        type: feature
        status: Done
        priority: High
        name: "Роли и гейты вынесены из рабочей обёртки в плагин"
        description: |
          Сделано 2026-09-27. До этого роль-модель лежала в `.claude/` рабочей обёртки: репозиторий,
          клонированный отдельно, оставался без ролей, гейтов и правил работы над ним, а второй
          репозиторий рядом получал копию, расходящуюся с первой молча.

          Что переехало: пять ролей и общая политика, опознание сессии, маркер architect-сессии,
          гейт git-записи, чтение конфига, доктор установки, строка состояния, генератор файлов
          ролей. Имена вычищены от привязки к одному продукту: переключатель роли —
          `HARNESS_SCOPE`, конфиг — `apiVersion: harness/v1`.

          Проверено: `claude plugin validate` зелёный; плагин ставится из своего репозитория и
          показывает верный состав; доктор на живом репозитории видит 16 зон, 18 файлов ролей и
          включённый плагин.

      - id: zone-boundary-moved-to-permissions
        type: feature
        status: Done
        priority: High
        name: "Граница правки — штатными правилами доступа, а не своим хуком"
        description: |
          Сделано 2026-09-27, после сверки с докой Claude Code: файловые правки проверяются
          правилами `Edit(путь)`, и правила можно дать сессии отдельным файлом настроек.

          Свой хук на каждую правку (218 строк) удалён; логика владения путями осталась —
          её использует проверка состава коммита. Файлы ролей собираются из конфига
          (`scripts/generate-roles.mjs`): в каждом объявлена роль и закрыты чужие зоны.

          Проверено живьём, а не по доке: сессия роли `ui` попыталась создать файл в чужой зоне —
          отбито, файл не появился.

          Git в файлы ролей НЕ вынесен намеренно — разбор в FAQ.md: правила приезжают только с
          флагом, а забыть флаг легко.

      - id: skills-speak-to-repository-files
        type: feature
        status: Done
        priority: High
        name: "Пять скиллов переписаны на файлы репозитория"
        description: |
          Сделано 2026-09-27. `shift`, `task`, `report`, `verdict`, `checkpoint` писали ТЗ, отчёты,
          вердикты и состояние прогона во внешнюю службу — то есть были мертвы у любого, у кого её
          нет, и заводили второй источник истины у того, у кого есть.

          Теперь всё идёт в `ROADMAP.yaml` того скоупа, которого касается работа: ТЗ — пунктом,
          отчёт и вердикт — в тот же пункт, состояние прогона — туда же. Скиллы лежат в плагине и
          вызываются как `/harness:<имя>`; модель их сама не запускает — у каждого есть побочный
          эффект, правка файла.

      - id: wrapper-moved-to-the-plugin
        type: feature
        status: Done
        priority: High
        name: "Рабочая обёртка перешла на плагин и рассталась со своей копией"
        description: |
          Сделано 2026-09-27. Обёртка, из которой роль-модель вынесена, работала по своей копии —
          то есть ровно то расхождение, от которого уходили.

          Теперь у неё включён плагин, файлы ролей собраны из её собственного конфига (зоны у неё
          свои: каноны, приложения, службы), а копия ролей, гейтов и скиллов удалена. Из её конфига
          заодно убраны зоны пакетов базы: они объявлены в конфиге самой базы, и держать вторую
          раскладку значило бы завести то же расхождение на уровне данных.

      - id: gate-tells-empty-input-from-truncated
        type: bug
        status: Done
        priority: Medium
        name: "Обрезанный вход больше не превращается в разрешение"
        description: |
          Найдено и починено 2026-09-27. Хук на любом неразобранном входе отвечал `allow`
          (fail-open, чтобы баг гейта не ломал работу) — и поймано это было на обрезанном входе:
          команда, которую гейт обязан резать, прошла.

          Разведены два случая, которые раньше были одним: ПУСТОЙ вход (хука позвали без данных)
          остаётся `allow`, а вход, который начали писать и не дописали, получает отказ — какая
          это была команда, неизвестно, значит неизвестно и то, можно ли её этой роли.

          Проверено тремя прогонами: пустой вход — разрешение, обрезанный — отказ, полный — отказ
          по существу (`git push` роли owner).

      - id: statusline-is-a-personal-setting
        type: feature
        status: Done
        priority: Low
        name: "Строка состояния объявлена личной настройкой, и доктор о ней напоминает"
        description: |
          Сделано 2026-09-27. Плагин задать `statusLine` не может (Claude Code берёт её только из
          настроек), а репозиторий задавать не должен: путь до установленного плагина у каждого
          свой. Значит это личная настройка — и доктор теперь не требует её, а напоминает тому, у
          кого роль на экране не видна, с точным путём до его файла настроек (каталог берётся из
          переменной, а не из домашней папки — он переносим).
