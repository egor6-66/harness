# ТЗ роль-модели. Истина здесь: пункт этого файла — задача, его описание — её состояние.
# Что умеет харнесс — README.md, почему так — FAQ.md.
categories:
  - category: Выделение в самостоятельный инструмент
    items:
      - id: extracted-from-the-wrapper
        type: feature
        status: Done
        priority: High
        name: "Роли и гейты вынесены из рабочей обёртки в плагин"
        description: |
          Сделано 2026-09-27. До этого роль-модель лежала в `.claude/` рабочей обёртки: репозиторий,
          клонированный отдельно, оставался без ролей, гейтов и правил работы над ним, а второй
          репозиторий рядом получал копию, расходящуюся с первой молча.

          Что переехало: пять ролей и общая политика, опознание сессии, маркер architect-сессии,
          гейт git-записи, чтение конфига, доктор установки, строка состояния, генератор файлов
          ролей. Имена вычищены от привязки к одному продукту: переключатель роли —
          `HARNESS_SCOPE`, конфиг — `apiVersion: harness/v1`.

          Проверено: `claude plugin validate` зелёный; доктор на живом репозитории видит 16 зон,
          18 файлов ролей и включённый плагин.

      - id: zone-boundary-moved-to-permissions
        type: feature
        status: Done
        priority: High
        name: "Граница правки — штатными правилами доступа, а не своим хуком"
        description: |
          Сделано 2026-09-27, после сверки с докой Claude Code: файловые правки проверяются
          правилами `Edit(путь)`, и правила можно дать сессии отдельным файлом настроек.

          Свой хук на каждую правку (218 строк) удалён; логика владения путями осталась —
          её использует проверка состава коммита. Файлы ролей собираются из конфига
          (`scripts/generate-roles.mjs`): в каждом объявлена роль и закрыты чужие зоны.

          Проверено живьём, а не по доке: сессия роли `ui` попыталась создать файл в чужой зоне —
          отбито, файл не появился.

          Git в файлы ролей НЕ вынесен намеренно — разбор в FAQ.md: правила приезжают только с
          флагом, а забыть флаг легко.

  - category: Открытое
    items:
      - id: skills-still-speak-to-a-tracker
        type: bug
        status: Open
        priority: High
        name: "Пять скиллов написаны под внешний трекер, которого в работе нет"
        description: |
          `shift`, `task`, `report`, `verdict`, `checkpoint` пишут ТЗ, отчёты, вердикты и состояние
          прогона узлами и комментами во внешнюю службу. Служба необязательна и в работе не
          используется — значит скиллы либо мертвы, либо требуют доступа, которого у клонировавшего
          репозиторий нет.

          Что сделать: переписать их на файлы скоупа (ТЗ и состояние — пункт `ROADMAP.yaml`,
          обоснование — `FAQ.md`) и положить в плагин как `skills/`. Роли и общая политика уже
          переписаны на файлы — скиллы остались единственным местом, где служба упоминается как
          обязательная.

      - id: fail-open-on-truncated-input
        type: bug
        status: Open
        priority: Medium
        name: "Гейт пропускает команду, если вход пришёл обрезанным"
        description: |
          Найдено 2026-09-27 при проверке гейта. Хук читает вход целиком и на неразобранном JSON
          отвечает `allow` (fail-open, чтобы баг гейта не ломал чтение). Поймано на обрезанном
          входе: команда, которую гейт обязан резать, прошла.

          В реальной сессии вход приходит целиком, поэтому приоритет не высший. Но fail-open на
          неполном входе — это дыра по определению: разбирать надо, отличается ли «вход не пришёл»
          от «вход не разобрался», и во втором случае отвечать отказом, а не разрешением.

      - id: doctor-checks-nothing-about-statusline
        type: feature
        status: Open
        priority: Low
        name: "Строка состояния стала личной настройкой — доктор о ней больше не говорит"
        description: |
          Плагин не может задать `statusLine` (Claude Code берёт её только из настроек), поэтому
          роль на экране включает каждый у себя. Доктор раньше требовал её в настройках
          репозитория и теперь эту проверку потерял вовсе.

          Что сделать: сказать про неё там, где человек её включает — отдельной строкой отчёта
          доктора, уведомлением, а не красным: отсутствие строки состояния ничего не ломает.

      - id: wrapper-still-has-its-own-copy
        type: bug
        status: Open
        priority: High
        name: "Рабочая обёртка держит свою копию ролей и гейтов"
        description: |
          Обёртка, из которой харнесс вынесен, до сих пор работает по своей копии: `.claude/agents`
          и `.claude/hooks` в ней остались. Пока так — есть ровно то расхождение, от которого
          уходили: правка в плагине не доезжает до её сессий.

          Что сделать: включить в ней плагин, собрать её файлы ролей из её собственного
          `harness.yaml` (зоны у неё свои) и удалить копию.
